name: Build Kernel ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib binutils grub-pc-bin grub-common xorriso mtools

      - name: Build Kernel Binary and ISO
        run: |
          set -ex

          # Flags para compilação 32-bit bare-metal
          CFLAGS="-m32 -ffreestanding -fno-pic -fno-pie -fno-stack-protector -O2 -Wall -Wextra"

          # Compila Assembly
          gcc -m32 -c test_os/boot.s -o test_os/boot.o
          gcc -m32 -c test_os/interrupts.s -o test_os/interrupts.o

          # Compila C
          gcc $CFLAGS -c freestanding/kmem.c -o test_os/kmem.o
          gcc $CFLAGS -c freestanding/kfixed.c -o test_os/kfixed.o
          gcc $CFLAGS -c freestanding/kprintf.c -o test_os/kprintf.o
          gcc $CFLAGS -c freestanding/kgfx.c -o test_os/kgfx.o
          gcc $CFLAGS -c freestanding/kstring.c -o test_os/kstring.o
          gcc $CFLAGS -c freestanding/kvfs.c -o test_os/kvfs.o
          gcc $CFLAGS -c test_os/gdt.c -o test_os/gdt.o
          gcc $CFLAGS -c test_os/idt.c -o test_os/idt.o
          gcc $CFLAGS -c test_os/ps2.c -o test_os/ps2.o
          gcc $CFLAGS -c test_os/kernel.c -o test_os/kernel.o

          # Localiza libgcc 32-bit do sistema de compilação
          LIBGCC_PATH=$(gcc -m32 -print-libgcc-file-name)

          # Linka o Binário ELF Multiboot usando ld direto
          ld -m elf_i386 -T test_os/linker.ld -o test_os/myos.bin \
             test_os/boot.o test_os/interrupts.o test_os/kmem.o test_os/kfixed.o \
             test_os/kprintf.o test_os/kgfx.o test_os/kstring.o test_os/kvfs.o \
             test_os/gdt.o test_os/idt.o test_os/ps2.o test_os/kernel.o \
             "$LIBGCC_PATH"

          # Valida Header Multiboot1
          grub-file --is-x86-multiboot test_os/myos.bin

          # Monta estrutura da ISO
          mkdir -p isodir/boot/grub
          cp test_os/myos.bin isodir/boot/myos.bin
          cp test_os/grub.cfg isodir/boot/grub/grub.cfg

          # Cria ISO bootável
          grub-mkrescue -o test_os.iso isodir

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test_os-bootable-iso
          path: test_os.iso
